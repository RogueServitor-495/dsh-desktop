name: build-installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  build-windows:
    name: Windows · NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache node distribution downloads
        uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: runtime-cache-${{ runner.os }}-node24
      - run: npm ci
      - name: Bundle runtime (win32-x64 node + dsh + pnpm)
        env:
          BUNDLE_PLATFORMS: win32-x64
        run: npm run bundle:runtime
      - name: Build installer (tauri → NSIS)
        run: npm run build:app
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: dsh-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload release meta (versions.json)
        uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: src-tauri/resources/runtime/versions.json
          if-no-files-found: warn

  build-macos:
    name: macOS · DMG + app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache node distribution downloads
        uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: runtime-cache-${{ runner.os }}-node24
      - run: npm ci
      - name: Bundle runtime (darwin-arm64 node + dsh + pnpm)
        env:
          BUNDLE_PLATFORMS: darwin-arm64
        run: npm run bundle:runtime
      - name: Build app + DMG
        run: npm run build:app
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: dsh-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: Publish installers
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release meta (versions + tag↔app version check)
        id: meta
        run: |
          mkdir -p src-tauri/resources/runtime
          cp -f artifacts/release-meta/versions.json src-tauri/resources/runtime/versions.json || true
          node scripts/release-version.mjs --check
          node scripts/release-version.mjs --github >> "$GITHUB_OUTPUT"
      - name: Versioned release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            DSH Desktop v${{ steps.meta.outputs.desktop }} · bundled dsh ${{ steps.meta.outputs.dsh }} · node v${{ steps.meta.outputs.node }}

            Versioning contract: tag MUST equal `src-tauri/tauri.conf.json` version (enforced by `scripts/release-version.mjs --check`); see [VERSIONING.md](https://github.com/${{ github.repository }}/blob/main/VERSIONING.md).
      - name: Nightly release (main)
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly build
          body: |
            Latest installers built from `main`.
            App version: v${{ steps.meta.outputs.desktop }} · bundled dsh ${{ steps.meta.outputs.dsh }} · node v${{ steps.meta.outputs.node }}
            - Windows: `dsh-windows-installer` (NSIS setup exe)
            - macOS: `dsh-macos-dmg` (DMG)
            Update `nightly` whenever main changes.
          allowUpdates: true
          replacesArtifacts: true
          artifacts: artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
