[package]
name = "dsh-manager"
version = "0.1.0"
description = "DSH Runtime Manager — supervise the DeepSeek Harness (dsh) runtime"
edition = "2021"

[lib]
name = "dsh_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
libc = "0.2"
